name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      # ローカルと同じ検査を回す(nix flake check が scripts/*.test.sh と lint をすべて実行する)
      - run: nix flake check --print-build-logs
